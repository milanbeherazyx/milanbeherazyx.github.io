name: Build & deploy to GitHub Pages

# Branch model (see AGENTS.md / README "Branching"): main = production
# (protected, deploys), develop = integration (protected, no deploy),
# feature/* = disposable work branches. This workflow runs the build +
# Lighthouse budget check on every PR into main or develop, and on every
# push to either (a push only happens via a merged, checks-passed PR once
# branch protection is enabled). Only main triggers an actual deploy.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI budget check
        run: npx lhci autorun --config=./.lighthouserc.json
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
